<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f5f3ee" />
    <title>VERTU Studio | Store manager</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%234a7048' d='M12 1c.7 5.6 5.4 10.3 11 11-5.6.7-10.3 5.4-11 11-.7-5.6-5.4-10.3-11-11C6.6 11.3 11.3 6.6 12 1z'/%3E%3C/svg%3E" />
  </head>
  <body>
    <a class="skip" href="#view">Skip to content</a>
    <div class="shell">
      <aside class="side">
        <a class="side__brand" href="#/overview" aria-label="VERTU Studio, overview">
          <span class="side__logo" role="img" aria-label="VERTU"></span>
          <span class="side__sub">Store manager</span>
        </a>
        <nav class="side__nav" aria-label="Admin">
          <a href="#/overview" data-route="overview"></a>
          <a href="#/products" data-route="products"></a>
          <a href="#/orders" data-route="orders"></a>
          <a href="#/returns" data-route="returns"></a>
          <a href="#/content" data-route="content"></a>
          <a href="#/discounts" data-route="discounts"></a>
          <a href="#/settings" data-route="settings"></a>
        </nav>
        <div class="side__foot">
          <p class="side__who" data-who hidden></p>
          <a class="side__link" href="../" target="_blank" rel="noopener">View storefront</a>
          <p class="side__note" data-demo-note>
            Sample mode: data is saved in this browser only. Add the Supabase keys to go live.
          </p>
          <button type="button" class="link-btn" data-reset>Reset sample data</button>
          <button type="button" class="link-btn" data-signout hidden>Sign out</button>
        </div>
      </aside>

      <div class="main">
        <main id="view" tabindex="-1"></main>
      </div>
    </div>

    <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <div class="drawer__scrim" data-drawer-close></div>
      <div class="drawer__panel">
        <header class="drawer__head">
          <div>
            <h2 id="drawer-title"></h2>
            <p class="drawer__sub"></p>
          </div>
          <button type="button" class="link-btn" data-drawer-close>Close</button>
        </header>
        <div class="drawer__body"></div>
        <footer class="drawer__foot"></footer>
      </div>
    </aside>

    <dialog id="confirm" aria-labelledby="confirm-title">
      <form method="dialog">
        <h2 id="confirm-title"></h2>
        <p class="confirm__body"></p>
        <div class="confirm__actions">
          <button type="submit" value="cancel" class="btn btn--ghost">Cancel</button>
          <button type="submit" value="ok" class="btn btn--ink" data-confirm-ok>Confirm</button>
        </div>
      </form>
    </dialog>

    <div class="toast" role="status" aria-live="polite"><span></span><button type="button" class="link-btn" hidden></button></div>

    <script type="module" src="/src/admin/main.js"></script>
  </body>
</html>

# Deploys every Supabase Edge Function (checkout, payments, emails, shipping, health...) to your project.
# Runs when you press "Run workflow" in the Actions tab, and after any push that changes supabase/functions.
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN   supabase.com -> your avatar -> Account preferences -> Access Tokens -> Generate
#   SUPABASE_PROJECT_REF    the id in your project's address, e.g. wllgftkfpxoczsgyjdbm
name: Deploy server functions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml']
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check secrets
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$REF" ]; then
            echo "::warning::Add the SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF repository secrets to deploy the functions."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --use-api
